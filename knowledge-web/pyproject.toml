[project]
name = "kbweb"
version = "0.1.0"
description = "Flask frontend for the kbsvc knowledge retrieval service"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
prod = ["waitress>=3.0"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "respx>=0.21"]
e2e = ["playwright>=1.49", "pytest-playwright>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kbweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["e2e: drives a real browser against a live server"]
# E2E needs a browser and a live port; opt in with -m e2e.
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
src = ["kbweb", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["kbweb"]
