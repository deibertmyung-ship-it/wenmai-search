{% extends "base.html" %}
{% block title %}导入{% endblock %}

{% block content %}
<h1 class="section-title">导入</h1>

<div class="panel">
  <h2>新建目录</h2>
  <form class="form-grid" method="post" action="{{ url_for('ingest.create_source') }}">
    <div class="form-row">
      <label class="rail__label" for="src-name">名称</label>
      <input class="field field--sm" id="src-name" name="name" required placeholder="guji">
      <span class="form-row__hint">同名目录会被复用，不会重复创建。</span>
    </div>
    <div class="form-row">
      <label class="rail__label" for="src-kind">类型</label>
      <select class="field field--sm" id="src-kind" name="kind">
        <option value="upload">upload</option>
        <option value="filesystem">filesystem</option>
        <option value="url">url</option>
      </select>
    </div>
    <div class="form-row">
      <label class="rail__label" for="src-uri">根路径 / 基地址（可选）</label>
      <input class="field field--sm" id="src-uri" name="uri" placeholder="D:/books">
    </div>
    <button class="btn" type="submit" style="justify-self: start">创建</button>
  </form>
</div>

<div class="panel">
  <h2>上传单个文件</h2>
  <form class="form-grid" method="post" action="{{ url_for('ingest.upload') }}" enctype="multipart/form-data">
    <div class="form-row">
      <label class="rail__label" for="up-source">目录</label>
      <select class="field field--sm" id="up-source" name="source_id" required>
        {% for source in sources %}<option value="{{ source.id }}">{{ source.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label class="rail__label" for="up-file">文件</label>
      <input class="field field--sm" type="file" id="up-file" name="file" required>
      <span class="form-row__hint">txt / md 直接解析；pdf、docx 等需服务端安装对应解析器。</span>
    </div>
    <div class="form-row">
      <label class="rail__label" for="up-title">标题（可选）</label>
      <input class="field field--sm" id="up-title" name="title">
    </div>
    <button class="btn" type="submit" style="justify-self: start">上传并入队</button>
  </form>
</div>

<div class="panel">
  <h2>按路径批量导入</h2>
  <p class="form-row__hint">路径必须是 <strong>kbsvc 服务端</strong>可读的位置。大批量语料走这条，避免经 HTTP 传输。</p>
  <form class="form-grid" method="post" action="{{ url_for('ingest.ingest_path') }}" style="margin-top: var(--space-3)">
    <div class="form-row">
      <label class="rail__label" for="path-source">目录</label>
      <select class="field field--sm" id="path-source" name="source_id" required>
        {% for source in sources %}<option value="{{ source.id }}">{{ source.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label class="rail__label" for="path-path">服务端路径</label>
      <input class="field field--sm" id="path-path" name="path" required placeholder="D:/books/六壬">
    </div>
    <div class="form-row">
      <label class="rail__label" for="path-patterns">匹配模式</label>
      <input class="field field--sm" id="path-patterns" name="patterns" value="*.txt,*.md">
    </div>
    <label class="check"><input type="checkbox" name="recursive" checked> 递归子目录</label>
    <button class="btn" type="submit" style="justify-self: start">登记并入队</button>
  </form>
</div>
{% endblock %}
