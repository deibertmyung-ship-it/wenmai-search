{% extends "base.html" %}
{% block title %}请求出错{% endblock %}
{% block content %}
<div class="empty">
  <span class="empty__mark">误</span>
  <h2>{{ error.message }}</h2>
  <p class="table__mono">{{ error.code }}</p>

</div>
{% endblock %}
