name: kbsvc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kbsvc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kbsvc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbsvc -d kbsvc"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kbsvc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "serve", "--host", "0.0.0.0", "--port", "8077"]
    environment: &kb_env
      KB_PROFILE: server
      KB_DATABASE_URL: postgresql+psycopg://kbsvc:${POSTGRES_PASSWORD}@postgres:5432/kbsvc
      KB_STORAGE_BACKEND: s3
      KB_S3_ENDPOINT_URL: http://minio:9000
      KB_S3_BUCKET: ${MINIO_BUCKET:-kbsvc}
      KB_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kbsvc}
      KB_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KB_QDRANT_URL: http://qdrant:6333
      KB_QDRANT_API_KEY: ${QDRANT_API_KEY}
      KB_DENSE_PROVIDER: ${KB_DENSE_PROVIDER:-fastembed}
      KB_DENSE_MODEL: ${KB_DENSE_MODEL:-BAAI/bge-small-zh-v1.5}
      KB_AUTH_REQUIRED: "true"
    ports:
      - "${KB_API_PORT:-8077}:8077"
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "worker"]
    environment: *kb_env
    # Scale freely: jobs are leased, so workers never process the same job twice.
    deploy:
      replicas: ${KB_WORKER_REPLICAS:-2}
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "mcp", "--transport", "streamable-http"]
    environment:
      <<: *kb_env
      KB_MCP_API_KEY: ${KB_MCP_API_KEY:?issue one with `kbsvc issue-key`}
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8078"
    ports:
      - "${KB_MCP_PORT:-8078}:8078"
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
  qdrantdata:
  miniodata:
