name: kbsvc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kbsvc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kbsvc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbsvc -d kbsvc"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kbsvc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "serve", "--host", "0.0.0.0", "--port", "8077"]
    environment: &kb_env
      KB_PROFILE: server
      # Holds the tantivy index and the ONNX weights. Postgres owns the
      # metadata and MinIO owns the raw files, so nothing else lands here.
      KB_DATA_DIR: /data
      KB_DATABASE_URL: postgresql+psycopg://kbsvc:${POSTGRES_PASSWORD}@postgres:5432/kbsvc
      KB_STORAGE_BACKEND: s3
      KB_S3_ENDPOINT_URL: http://minio:9000
      KB_S3_BUCKET: ${MINIO_BUCKET:-kbsvc}
      KB_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kbsvc}
      KB_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KB_QDRANT_URL: http://qdrant:6333
      KB_QDRANT_API_KEY: ${QDRANT_API_KEY}
      KB_API_WORKER_ENABLED: "false"
      KB_DENSE_PROVIDER: ${KB_DENSE_PROVIDER:-fastembed}
      KB_DENSE_MODEL: ${KB_DENSE_MODEL:-BAAI/bge-small-zh-v1.5}
      KB_AUTH_REQUIRED: "true"
      # Plagiarism (PostgreSQL-only, default-off). The two switches are
      # independent so the corpus can be built while the API stays shut.
      KB_PLAG_ENABLED: ${KB_PLAG_ENABLED:-false}
      KB_PLAG_INDEXING_ENABLED: ${KB_PLAG_INDEXING_ENABLED:-false}
    volumes: &kb_volumes
      # Every kbsvc container shares one lexical index and one model cache.
      # Tantivy is an in-process library with no server form: without a shared
      # mount each container silently indexes into its own empty directory and
      # the sparse half of hybrid search returns nothing.
      - kbdata:/data
      # Corpus visible to `kbsvc ingest` and POST /v1/ingest/path.
      - ../../book:/corpus:ro
    ports:
      - "${KB_API_PORT:-8077}:8077"
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "worker"]
    environment: *kb_env
    volumes: *kb_volumes
    # The image probes /healthz on 8077. A worker serves no HTTP, so inheriting
    # that check would report a healthy worker as permanently unhealthy.
    healthcheck:
      disable: true
    # Jobs are leased, so the Postgres side scales freely - but tantivy takes an
    # exclusive directory lock and every worker writes the lexical index inline
    # (ingest/worker.py). A second replica fails to acquire the writer. Raising
    # this needs the lexical writes moved behind a single writer first; until
    # then the ceiling is one worker process.
    deploy:
      replicas: ${KB_WORKER_REPLICAS:-1}
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  # Detection and projection building. A process of its own, not extra replicas
  # of `worker`: alignment is CPU-bound and would stall parsing, embedding and
  # index writes if it shared one. Unlike `worker` this one has no lexical
  # index to lock, so replicas scale freely - the ceiling here is CPU.
  plagiarism-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "plagiarism-worker"]
    environment: *kb_env
    volumes: *kb_volumes
    healthcheck:
      disable: true
    deploy:
      replicas: ${KB_PLAG_WORKER_REPLICAS:-0}
    depends_on:
      postgres: {condition: service_healthy}

  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      ["kbsvc", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8078"]
    environment:
      <<: *kb_env
      KB_MCP_API_KEY: ${KB_MCP_API_KEY:?issue one with `kbsvc issue-key`}
    volumes: *kb_volumes
    # Same reason as the worker: this process listens on 8078, not 8077.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.create_connection(('127.0.0.1',8078),3); s.close()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "${KB_MCP_PORT:-8078}:8078"
    depends_on:
      api: {condition: service_started}

  web:
    build:
      context: ../../knowledge-web
      dockerfile: deploy/Dockerfile
    environment:
      KBWEB_API_BASE: http://api:8077
      KBWEB_API_KEY: ${KBWEB_API_KEY:?issue one with `kbsvc issue-key`}
      KBWEB_SECRET_KEY: ${KBWEB_SECRET_KEY:?set KBWEB_SECRET_KEY in .env}
      KBWEB_DEBUG_UI: ${KBWEB_DEBUG_UI:-true}
      KBWEB_TIMEOUT: "60"
    ports:
      - "${KBWEB_PORT:-5055}:5055"
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
  qdrantdata:
  miniodata:
  kbdata:
