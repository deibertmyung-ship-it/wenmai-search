name: kbsvc

services:
  postgres:
    # ParadeDB: standard PostgreSQL 17 plus pg_search and pgvector, both
    # pre-installed and already wired into shared_preload_libraries (ADR-0008
    # ticket 05). Pinned by digest rather than a tag: this is the exact image
    # tested throughout tickets 05-09 and used for the 2026-08-18 production
    # PG16->17 cutover (pg_search 0.25.2, pgvector 0.8.4). Re-derive with
    # `docker inspect paradedb/paradedb:latest-pg17 --format '{{json .RepoDigests}}'`
    # before ever changing this - see docs/04-runbook.md section 2 for the
    # PG16->17 upgrade procedure (section 6).
    image: paradedb/paradedb@sha256:dca046b8a0ddd070c368d5254cbb7f596b3b7bc67bc2efa7c0fbe881087883bb
    # Docker's default /dev/shm is 64MB. pgvector's parallel HNSW build fails
    # against that ceiling - only at index-build time, never on ordinary
    # queries. See docs/04-runbook.md section 2.
    shm_size: 2gb
    environment:
      POSTGRES_USER: kbsvc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kbsvc
    volumes:
      # pgdata_pg17 holds the post-cutover ParadeDB cluster (restored via
      # pg_dump/pg_restore from the old PG16 volume on 2026-08-18, see ADR-0008
      # ticket 12 Comments). The old `pgdata` volume is deliberately left
      # declared below and NOT referenced by any service - it is the PG16
      # rollback copy (paired with the `kbsvc-postgres-1-pg16-rollback`
      # container). Do not `docker volume prune` until the observation window
      # (ticket 12) is over and ticket 13 explicitly authorizes deletion.
      - pgdata_pg17:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbsvc -d kbsvc"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kbsvc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "serve", "--host", "0.0.0.0", "--port", "8077"]
    environment: &kb_env
      KB_PROFILE: server
      # Holds the tantivy index and the ONNX weights. Postgres owns the
      # metadata and MinIO owns the raw files, so nothing else lands here.
      KB_DATA_DIR: /data
      KB_DATABASE_URL: postgresql+psycopg://kbsvc:${POSTGRES_PASSWORD}@postgres:5432/kbsvc
      KB_STORAGE_BACKEND: s3
      KB_S3_ENDPOINT_URL: http://minio:9000
      KB_S3_BUCKET: ${MINIO_BUCKET:-kbsvc}
      KB_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kbsvc}
      KB_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      KB_QDRANT_URL: http://qdrant:6333
      KB_QDRANT_API_KEY: ${QDRANT_API_KEY}
      # Cutover to the ADR-0008 PG-native stack, 2026-08-19 (ticket 12; ticket 11's
      # A/B report). qdrant/qdrant above is deliberately left wired and the
      # container kept running - it is the rollback target. Flip both vars back
      # to qdrant/tantivy to roll back; no rebuild needed, the old indexes are
      # untouched.
      KB_VECTOR_BACKEND: ${KB_VECTOR_BACKEND:-pgvector}
      KB_LEXICAL_BACKEND: ${KB_LEXICAL_BACKEND:-pg-search}
      KB_API_WORKER_ENABLED: "false"
      KB_DENSE_PROVIDER: ${KB_DENSE_PROVIDER:-fastembed}
      KB_DENSE_MODEL: ${KB_DENSE_MODEL:-BAAI/bge-small-zh-v1.5}
      KB_AUTH_REQUIRED: "true"
      # Restrict /v1/ingest/path to the mounted corpus root. The volume is
      # read-only, so this is defense-in-depth against path traversal.
      KB_INGEST_ALLOWED_ROOTS: /corpus
      # Global per-IP rate limit (requests/min). 0 = disabled.
      KB_RATE_LIMIT_PER_MINUTE: ${KB_RATE_LIMIT_PER_MINUTE:-0}
      # Plagiarism (PostgreSQL-only, default-off). The two switches are
      # independent so the corpus can be built while the API stays shut.
      KB_PLAG_ENABLED: ${KB_PLAG_ENABLED:-false}
      KB_PLAG_INDEXING_ENABLED: ${KB_PLAG_INDEXING_ENABLED:-false}
      # The tunables have to be forwarded explicitly. `.env` is read by compose
      # for interpolation, not mounted into the container - so a var that is not
      # named here is simply invisible to the app, which then silently uses its
      # code default. `.env.example` documents all of these, so every one of
      # them has to appear.
      #
      # These four decide the algorithm config hash; changing any invalidates
      # every stored projection and requires `kbsvc plagiarism rebuild`.
      KB_PLAG_SENTENCES_PER_CHUNK: ${KB_PLAG_SENTENCES_PER_CHUNK:-4}
      KB_PLAG_CHUNK_OVERLAP: ${KB_PLAG_CHUNK_OVERLAP:-1}
      KB_PLAG_KGRAM: ${KB_PLAG_KGRAM:-5}
      KB_PLAG_WINNOW_WINDOW: ${KB_PLAG_WINNOW_WINDOW:-8}
      # Query-time tuning; no rebuild needed.
      KB_PLAG_MIN_SEED_LEN: ${KB_PLAG_MIN_SEED_LEN:-30}
      KB_PLAG_MIN_PASSAGE_LEN: ${KB_PLAG_MIN_PASSAGE_LEN:-50}
      KB_PLAG_ZH_MIN_SEED_LEN: ${KB_PLAG_ZH_MIN_SEED_LEN:-12}
      KB_PLAG_ZH_MIN_PASSAGE_LEN: ${KB_PLAG_ZH_MIN_PASSAGE_LEN:-20}
      KB_PLAG_MIN_EFFECTIVE_CHARS: ${KB_PLAG_MIN_EFFECTIVE_CHARS:-12}
      KB_PLAG_SHORT_EXACT_MIN_SCORE: ${KB_PLAG_SHORT_EXACT_MIN_SCORE:-0.99}
      KB_PLAG_EXTEND_TOLERANCE: ${KB_PLAG_EXTEND_TOLERANCE:-0.85}
      KB_PLAG_DF_RATIO_THRESHOLD: ${KB_PLAG_DF_RATIO_THRESHOLD:-0.25}
      KB_PLAG_MIN_WORD_RATIO: ${KB_PLAG_MIN_WORD_RATIO:-0.5}
      KB_PLAG_CANDIDATE_TOP_K: ${KB_PLAG_CANDIDATE_TOP_K:-50}
      # Limits.
      KB_PLAG_MAX_INPUT_CHARS: ${KB_PLAG_MAX_INPUT_CHARS:-500000}
      KB_PLAG_BUDGET_SECONDS: ${KB_PLAG_BUDGET_SECONDS:-60}
      KB_PLAG_BUDGET_REFERENCE_CHARS: ${KB_PLAG_BUDGET_REFERENCE_CHARS:-100000}
      KB_PLAG_MAX_ACTIVE_CHECKS_PER_KEY: ${KB_PLAG_MAX_ACTIVE_CHECKS_PER_KEY:-2}
      KB_PLAG_PREVIEW_CHARS: ${KB_PLAG_PREVIEW_CHARS:-300}
      # Jobs and SSE.
      KB_PLAG_POLL_INTERVAL: ${KB_PLAG_POLL_INTERVAL:-1.0}
      KB_PLAG_LEASE_SECONDS: ${KB_PLAG_LEASE_SECONDS:-600}
      KB_PLAG_MAX_ATTEMPTS: ${KB_PLAG_MAX_ATTEMPTS:-3}
      KB_PLAG_SSE_POLL_INTERVAL: ${KB_PLAG_SSE_POLL_INTERVAL:-0.5}
      KB_PLAG_SSE_KEEPALIVE_INTERVAL: ${KB_PLAG_SSE_KEEPALIVE_INTERVAL:-2.0}
      KB_PLAG_SSE_MAX_SECONDS: ${KB_PLAG_SSE_MAX_SECONDS:-900}
      KB_PLAG_RETENTION_DAYS: ${KB_PLAG_RETENTION_DAYS:-30}
    volumes: &kb_volumes
      # Every kbsvc container shares one lexical index and one model cache.
      # Tantivy is an in-process library with no server form: without a shared
      # mount each container silently indexes into its own empty directory and
      # the sparse half of hybrid search returns nothing.
      - kbdata:/data
      # Corpus visible to `kbsvc ingest` and POST /v1/ingest/path.
      - ../../book:/corpus:ro
    ports:
      - "${KB_API_PORT:-8077}:8077"
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "worker"]
    environment: *kb_env
    volumes: *kb_volumes
    # The image probes /healthz on 8077. A worker serves no HTTP, so inheriting
    # that check would report a healthy worker as permanently unhealthy.
    healthcheck:
      disable: true
    # Jobs are leased, so the Postgres side scales freely - the single-writer
    # ceiling below was a tantivy constraint (exclusive directory lock, every
    # worker writing the lexical index inline in ingest/worker.py). Since the
    # 2026-08-19 cutover to KB_LEXICAL_BACKEND=pg-search that lock no longer
    # applies - pg_search indexes through Postgres, not a shared directory.
    # Replicas still default to 1 pending ticket 12's throughput verification
    # during the 14-day observation window; raise KB_WORKER_REPLICAS once that
    # confirms multi-worker ingestion actually scales as ADR-0008 intended.
    deploy:
      replicas: ${KB_WORKER_REPLICAS:-1}
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}

  # Detection and projection building. A process of its own, not extra replicas
  # of `worker`: alignment is CPU-bound and would stall parsing, embedding and
  # index writes if it shared one. Unlike `worker` this one has no lexical
  # index to lock, so replicas scale freely - the ceiling here is CPU.
  plagiarism-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["kbsvc", "plagiarism-worker"]
    environment: *kb_env
    volumes: *kb_volumes
    healthcheck:
      disable: true
    deploy:
      replicas: ${KB_PLAG_WORKER_REPLICAS:-0}
    depends_on:
      postgres: {condition: service_healthy}

  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      ["kbsvc", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8078"]
    environment:
      <<: *kb_env
      KB_MCP_API_KEY: ${KB_MCP_API_KEY:?issue one with `kbsvc issue-key`}
    volumes: *kb_volumes
    # Same reason as the worker: this process listens on 8078, not 8077.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket,sys; s=socket.create_connection(('127.0.0.1',8078),3); s.close()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "${KB_MCP_PORT:-8078}:8078"
    depends_on:
      api: {condition: service_started}

  web:
    build:
      context: ../../knowledge-web
      dockerfile: deploy/Dockerfile
    environment:
      KBWEB_API_BASE: http://api:8077
      KBWEB_API_KEY: ${KBWEB_API_KEY:?issue one with `kbsvc issue-key`}
      KBWEB_SECRET_KEY: ${KBWEB_SECRET_KEY:?set KBWEB_SECRET_KEY in .env}
      KBWEB_DEBUG_UI: ${KBWEB_DEBUG_UI:-true}
      KBWEB_TIMEOUT: "60"
    ports:
      - "${KBWEB_PORT:-5055}:5055"
    depends_on:
      api: {condition: service_started}

volumes:
  # PG16 data, preserved as the rollback target for the 2026-08-18 cutover
  # (see the `postgres` service comment above and ADR-0008 ticket 12). Not
  # mounted by any service.
  pgdata:
  pgdata_pg17:
  qdrantdata:
  miniodata:
  kbdata:
