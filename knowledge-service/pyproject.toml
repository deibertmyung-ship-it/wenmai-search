[project]
name = "kbsvc"
version = "0.1.0"
description = "Self-hosted knowledge retrieval system with REST + MCP interfaces"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "qdrant-client>=1.18,<1.19",
    # Lexical half of retrieval. Not optional: without an inverted index the
    # embedded profile falls back to scanning every chunk in Python.
    "tantivy>=0.24",
    # Traditional/old-glyph folding. Pure Python, single dictionary, no build
    # step - the corpus is mixed script and without it 陰陽 and 阴阳 retrieve
    # disjoint results.
    "zhconv>=1.4",
    "httpx>=0.27",
    "typer>=0.15",
    "python-multipart>=0.0.12",
    "mcp>=1.2",
    "docling>=2.15",
    "unstructured[all-docs]>=0.16",
    # Marker 2.x has a different public API; the parser adapter targets 1.x.
    "marker-pdf>=1.2,<2.0",
]

[project.optional-dependencies]
# psycopg is the driver; pgvector is its companion adapter package (ADR-0008
# ticket 06) - registers list[float] <-> Postgres `vector` binding on psycopg
# connections so callers never hand-format a `'[1,2,3]'` string into SQL text.
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
s3 = ["boto3>=1.35"]
# KB_VECTOR_BACKEND=sqlite-vec (ADR-0008, local profile only). Optional so
# deployments still on qdrant don't need it - see db/session.py's extension
# loader for the runtime error a missing install produces.
sqlite-vec = ["sqlite-vec>=0.1.9"]
fastembed = ["fastembed>=0.4"]
rerank = ["sentence-transformers>=3.3"]
# Plagiarism detection (PostgreSQL-only, default-off - see ADR-0001).
# pysbd is imported lazily inside the chunker, so the app starts and every
# other feature works without this extra installed; only projection building
# needs it.
plagiarism = ["pysbd>=0.3.4", "langdetect>=1.0.9"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
kbsvc = "kbsvc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbsvc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.coverage.run]
source = ["src/kbsvc"]
